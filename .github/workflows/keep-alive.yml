name: Keep Backend Alive

on:
  schedule:
    # Runs every 10 minutes (Render free tier sleeps after 15 mins)
    - cron: '*/10 * * * *'
  # Allows manual triggers in GitHub UI
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -s https://spendwise-backend-lows.onrender.com/health
